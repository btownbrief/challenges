<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A0C">
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Btown Challenges — do the thing, put your name on it</title>
<meta name="description" content="Real challenges around Burlington. Finish one, put your name on the board.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- GoatCounter -->
<script data-goatcounter="https://btown-brief.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="hero">
  <div class="grain" aria-hidden="true"></div>
  <div class="hero-copy">
    <p class="eyebrow">BTown Games · a Burlington Brief thing</p>
    <h1>Btown<br><em>Challenges</em> <span aria-hidden="true">🏆</span></h1>
    <p class="lede">Real challenges around Burlington. Finish one, put your name on the board.</p>
    <a class="pill" href="#challenges">Find a challenge →</a>
  </div>
</header>

<main class="wrap" id="challenges">
  <section class="filters" aria-labelledby="filter-label">
    <span class="filter-label" id="filter-label">Show me</span>
    <div class="chips" id="category-chips" role="group" aria-label="Filter challenges"></div>
  </section>
  <section class="challenge-grid" id="challenge-grid" aria-live="polite"></section>
</main>

<footer class="foot">
  <span>A <a href="https://www.btownbrief.com">Burlington Brief</a> game · made in Vermont</span>
  <a href="https://play.btownbrief.com/">More games</a>
</footer>

<script src="js/app.js"></script>
<script src="https://play.btownbrief.com/nav.js" defer></script>
</body>
</html>
